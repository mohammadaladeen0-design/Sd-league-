<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameZone — Gaming Community</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial}.wrap{max-width:1180px;margin:auto;padding:20px}.nav{position:sticky;top:0;background:#070b14ee;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff16;z-index:5}.navin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:23px;font-weight:900}.logo i{color:#22d3ee;font-style:normal}.links{display:flex;gap:6px;flex-wrap:wrap}.links button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#ffffff0d;color:#cbd5e1;cursor:pointer}.links button:hover,.btn:hover{background:#ffffff18}.primary{background:#22d3ee;color:#061018;font-weight:800}.hero{padding:70px 20px 35px;text-align:center}.hero h1{font-size:clamp(42px,8vw,78px);margin:8px 0}.hero p{color:#94a3b8;font-size:18px;max-width:700px;margin:0 auto 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#0e1421;border:1px solid #ffffff12;border-radius:20px;padding:20px}.card:hover{border-color:#22d3ee55}.icon{width:58px;height:58px;border-radius:15px;background:#ffffff0b;display:grid;place-items:center;font-size:28px}.muted{color:#94a3b8}.tag{display:inline-block;color:#67e8f9;background:#22d3ee12;border:1px solid #22d3ee25;border-radius:999px;padding:5px 9px;font-size:12px}.section{margin:34px 0}.section h2{font-size:28px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:10px}.room{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffffff06;border-radius:14px;padding:14px}.rank{display:grid;grid-template-columns:50px 1fr 90px;gap:10px;align-items:center;padding:14px;border-bottom:1px solid #ffffff0b}.num{font-weight:900;color:#67e8f9}.points{font-weight:900}.chat{height:240px;overflow:auto;background:#080d17;border-radius:15px;padding:14px}.msg{margin:8px 0;padding:9px 12px;background:#ffffff08;border-radius:12px}.footer{border-top:1px solid #ffffff12;margin-top:45px;padding:25px 20px;color:#64748b;text-align:center}@media(max-width:700px){.links{display:none}.hero{padding-top:45px}.rank{grid-template-columns:38px 1fr 65px}}
</style></head><body><div class="nav"><div class="navin"><div class="logo">Game<i>Zone</i></div><div class="links"><button onclick="show('home')">الرئيسية</button><button onclick="show('games')">الألعاب</button><button onclick="show('rooms')">الغرف</button><button onclick="show('tournaments')">البطولات</button><button onclick="show('players')">اللاعبين</button><button onclick="show('community')">المجتمع</button></div><button class="btn primary" onclick="alert('واجهة تسجيل الدخول جاهزة في النسخة الكاملة')">دخول</button></div></div><main id="app"></main><footer class="footer">GameZone — مجتمع ألعاب وبطولات</footer><script>
const games=[['⚽','FC Mobile','كرة القدم'],['🎯','Call of Duty Mobile','تصويب'],['⚽','eFootball Mobile','كرة القدم'],['🪖','PUBG Mobile','باتل رويال'],['🔥','Free Fire','باتل رويال']];const players=[['Mohamed','1250'],['ShadowX','1110'],['Killer','980'],['SUDAN丨7','920'],['ProMax','870']];const rooms=[['FC Mobile','1v1','3/4','مفتوحة'],['PUBG Mobile','Solo','7/10','مفتوحة'],['COD Mobile','2v2','4/4','ممتلئة'],['Free Fire','3v3','5/6','مفتوحة']];const tour=[['FC Mobile — بطولة الشهر','64 لاعب','التسجيل مفتوح'],['PUBG Mobile — كأس GameZone','32 لاعب','التسجيل مفتوح'],['COD Mobile — Night Cup','16 لاعب','جارية']];
function show(p){let h='';if(p==='home')h=`<section class="hero"><span class="tag">GAMING COMMUNITY • TOURNAMENTS</span><h1>Game<span style="color:#22d3ee">Zone</span></h1><p>مكان واحد للغرف، البطولات، الترتيب ومجتمع اللاعبين.</p><div><button class="btn primary" onclick="show('games')">ابدأ اللعب</button> <button class="btn" onclick="show('tournaments')">استكشف البطولات</button></div></section><div class="wrap"><section class="section"><div class="row"><h2>الألعاب</h2><button class="btn" onclick="show('games')">كل الألعاب</button></div><div class="grid">${games.map(g=>card(g[0],g[1],g[2])).join('')}</div></section><section class="section"><div class="row"><h2>غرف نشطة</h2><button class="btn" onclick="show('rooms')">كل الغرف</button></div><div class="list">${rooms.map(r=>room(r)).join('')}</div></section></div>`;if(p==='games')h=`<div class="wrap"><section class="section"><h1>الألعاب 🎮</h1><p class="muted">اختار لعبتك وشوف الغرف والبطولات.</p><div class="grid">${games.map(g=>card(g[0],g[1],g[2])).join('')}</div></section></div>`;if(p==='rooms')h=`<div class="wrap"><section class="section"><div class="row"><div><h1>الغرف 🚪</h1><p class="muted">انضم لمباراة أو أنشئ غرفة.</p></div><button class="btn primary" onclick="alert('في النسخة الكاملة يتم إنشاء الغرفة بعد تسجيل الدخول')">+ إنشاء غرفة</button></div><div class="list">${rooms.map(r=>room(r)).join('')}</div></section></div>`;if(p==='tournaments')h=`<div class="wrap"><section class="section"><h1>البطولات 🏆</h1><p class="muted">سجّل، نافس، واصعد في الترتيب.</p><div class="grid">${tour.map(t=>`<div class="card"><span class="tag">${t[2]}</span><h2>${t[0]}</h2><p class="muted">${t[1]} • جوائز وترتيب عالمي</p><button class="btn primary" onclick="alert('صفحة التسجيل متاحة في النسخة الكاملة')">عرض البطولة</button></div>`).join('')}</div></section></div>`;if(p==='players')h=`<div class="wrap"><section class="section"><h1>اللاعبين 👥</h1><p class="muted">أفضل اللاعبين في المجتمع.</p><div class="card">${players.map((x,i)=>`<div class="rank"><div class="num">#${i+1}</div><div><b>${x[0]}</b><div class="muted">لاعب GameZone</div></div><div class="points">${x[1]} XP</div></div>`).join('')}</div></section></div>`;if(p==='community')h=`<div class="wrap"><section class="section"><h1>المجتمع 💬</h1><div class="grid"><div class="card"><h2>الشات العام</h2><div class="chat"><div class="msg"><b>ShadowX:</b> من داخل بطولة الليلة؟</div><div class="msg"><b>Mohamed:</b> أنا جاهز 🔥</div><div class="msg"><b>SUDAN丨7:</b> نلعب FC Mobile</div></div><button class="btn primary" style="margin-top:12px" onclick="alert('الشات الحقيقي يحتاج Supabase في النسخة الكاملة')">إرسال رسالة</button></div><div class="card"><h2>أصدقاؤك</h2><p class="muted">أضف لاعبين وتابع نشاطهم ونتائجهم.</p><button class="btn" onclick="alert('نظام الأصدقاء موجود في النسخة الكاملة')">إدارة الأصدقاء</button></div></div></section></div>`;document.getElementById('app').innerHTML=h;scrollTo(0,0)}function card(i,n,c){return `<div class="card"><div class="icon">${i}</div><h2>${n}</h2><p class="muted">${c}</p><button class="btn primary" onclick="show('rooms')">دخول ←</button></div>`}function room(r){return `<div class="room"><div><b>${r[0]}</b><div class="muted">${r[1]} • ${r[2]} لاعبين</div></div><span class="tag">${r[3]}</span></div>`}show('home');</script></body></html>
